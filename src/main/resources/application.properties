# ---------------------------------------------------------------- algemeen
# Railway injects PORT; locally it stays 8080.
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:4321
# In production the Angular app lives on Vercel; set CORS_ORIGINS to that
# domain (comma-separated when there are several).
%prod.quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4321}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept
quarkus.http.cors.exposed-headers=Content-Disposition

# ---------------------------------------------------------------- beveiliging
# Alles achter een aanmelding, behalve wat hieronder uitdrukkelijk open staat.
# deny-unannotated-endpoints betekent: een nieuw endpoint zonder annotatie is
# dicht, niet open. Vergeten is dan onhandig in plaats van gevaarlijk.
quarkus.http.auth.basic=true
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# De waarde achter de dubbele punt is de standaard voor lokaal werken; op een
# server zet je ENROSED_ADMIN_USERNAME en ENROSED_ADMIN_PASSWORD_HASH als
# omgevingsvariabele en hoef je dit bestand niet aan te raken. Zo staat er nooit
# een productiewachtwoord in de repository.
enrosed.admin.username=${ENROSED_ADMIN_USERNAME:enrosedadmin}
# bcrypt-hash; het wachtwoord zelf staat nergens in de code of configuratie.
# Nieuwe hash maken: BcryptUtil.bcryptHash("...")
enrosed.admin.password-hash=${ENROSED_ADMIN_PASSWORD_HASH:$2a$10$w2nUZGHa7mgFgIZCcJZLB.G6Dk7ZdxJdhowuJhmd3ExrqTaZWp2Ty}

# ---------------------------------------------------------------- database
# H2 als bestand op schijf zodat er lokaal geen Docker nodig is. De gegevens
# blijven staan tussen herstarts: 'update' past het schema aan, 'drop-and-create'
# zou alles wissen. Wil je een schone start, verwijder dan de map ./data.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/enrosed;AUTO_SERVER=TRUE
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

%prod.quarkus.datasource.db-kind=postgresql
# Railway's Postgres plugin exposes PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD;
# these pick them up directly, so attaching the database is all it takes.
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:enrosed}
%prod.quarkus.datasource.username=${PGUSER:${DB_USERNAME:enrosed}}
%prod.quarkus.datasource.password=${PGPASSWORD:${DB_PASSWORD:enrosed}}
# "update" lets the first deploy create the schema. Once the model settles,
# switch DB_SCHEMA_STRATEGY to "validate" and manage changes deliberately.
%prod.quarkus.hibernate-orm.schema-management.strategy=${DB_SCHEMA_STRATEGY:update}

# ---------------------------------------------------------------- fotos
# Volledige kwaliteit, geen limiet, opgeslagen in de database.
quarkus.http.limits.max-body-size=64M

# ---------------------------------------------------------------- mail
#
# STANDAARD VERSTUURT DEZE APP GEEN MAIL.
#
# quarkus.mailer.mock=true betekent: de offerte wordt wel opgebouwd en de PDF
# wordt wel gemaakt, maar er vertrekt niets. De volledige mail komt in de
# serverlog te staan. Dat is met opzet, zodat je de flow kan uittesten zonder
# dat er per ongeluk post naar een echte klant gaat.
#
# ---- ECHT VERSTUREN? Zet mock op false en vul de vier regels eronder in ----
#
#   Gmail / Google Workspace   host=smtp.gmail.com   port=587  start-tls=REQUIRED
#     username = je volledige e-mailadres
#     password = een APP-WACHTWOORD (niet je gewone wachtwoord; aan te maken
#                in je Google-account onder Beveiliging -> App-wachtwoorden,
#                werkt alleen met tweestapsverificatie aan)
#
#   Microsoft 365              host=smtp.office365.com  port=587  start-tls=REQUIRED
#   Eigen hosting              vraag host, poort en gebruikersnaam aan je provider
#
# Het afzenderadres moet een adres zijn dat je echt mag gebruiken; anders
# weigert de ontvangende server de mail of belandt hij bij de spam.
quarkus.mailer.from=offertes@enrosed.be
quarkus.mailer.mock=true
#quarkus.mailer.host=smtp.gmail.com
#quarkus.mailer.port=587
#quarkus.mailer.start-tls=REQUIRED
#quarkus.mailer.username=offertes@enrosed.be
#quarkus.mailer.password=app-wachtwoord-hier

# Waar interne meldingen naartoe gaan (offerte getekend, wijziging gevraagd).
enrosed.mail.internal-recipient=verkoop@enrosed.be

# In productie komen de SMTP-gegevens uit omgevingsvariabelen (op Railway in te
# vullen bij de service). Zolang SMTP_HOST leeg is weigert de mailer met een
# duidelijke melding in plaats van een verbindingsfout.
%prod.quarkus.mailer.mock=false
%prod.quarkus.mailer.host=${SMTP_HOST:}
%prod.quarkus.mailer.port=${SMTP_PORT:587}
%prod.quarkus.mailer.start-tls=REQUIRED
%prod.quarkus.mailer.username=${SMTP_USERNAME:}
%prod.quarkus.mailer.password=${SMTP_PASSWORD:}
%prod.quarkus.mailer.from=${SMTP_FROM:offertes@enrosed.be}

# Basis-URL van de Angular app, voor de klantlink in de offertemail.
enrosed.portal.base-url=http://localhost:4321
# The links in quote PDFs and mails must point at the public Vercel app.
%prod.enrosed.portal.base-url=${PORTAL_BASE_URL:http://localhost:4321}

# ---------------------------------------------------------------- openapi
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Enrosed API
quarkus.smallrye-openapi.info-version=1.0.0

# Mail via de Brevo HTTPS-API. Railway blokkeert uitgaand SMTP onder het
# Pro-plan; een HTTPS-maildienst is daar de enige route. Leeg = SMTP proberen.
enrosed.mail.brevo-api-key=${BREVO_API_KEY:}
