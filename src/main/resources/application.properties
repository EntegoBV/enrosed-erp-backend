# ----------------------------------------------------------------- general
# Railway injects PORT; locally it stays 8080.
quarkus.http.port=${PORT:8080}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:4321,http://localhost:4324,http://localhost:4334,http://localhost:4335,http://127.0.0.1:4324,http://127.0.0.1:4334,http://127.0.0.1:4335
# In production the Angular app lives on Vercel; set CORS_ORIGINS to that
# domain (comma-separated when there are several).
%prod.quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:4321}
# Railway/proxy deployment: enable these only together with verified
# QUARKUS_HTTP_PROXY_TRUSTED_PROXIES values. Otherwise forwarded IP headers remain ignored.
%prod.quarkus.http.proxy.proxy-address-forwarding=${PROXY_ADDRESS_FORWARDING:false}
%prod.quarkus.http.proxy.allow-x-forwarded=${ALLOW_X_FORWARDED:false}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type,Accept,Idempotency-Key
quarkus.http.cors.exposed-headers=Content-Disposition,Retry-After

# ------------------------------------------------------ anonymous public forms
# HMAC protects form-start tokens and hashes rate-limit/idempotency identifiers.
# Production must provide a dedicated random secret; raw IP/e-mail values are never stored
# in the anti-abuse tables. X-Real-IP is read only on Railway and only when explicitly enabled;
# global forwarded-header trust remains disabled above.
enrosed.public-forms.hmac-secret=${PUBLIC_FORM_HMAC_SECRET:local-only-public-form-secret-change-me}
%prod.enrosed.public-forms.hmac-secret=${PUBLIC_FORM_HMAC_SECRET}
enrosed.public-forms.trust-railway-x-real-ip=${TRUST_RAILWAY_X_REAL_IP:false}
%prod.enrosed.public-forms.trust-railway-x-real-ip=${TRUST_RAILWAY_X_REAL_IP:true}

# Turnstile is optional for local/test. Supplying site key and secret makes it mandatory,
# including exact action and hostname verification. Configure both or neither.
enrosed.public-forms.turnstile.site-key=${TURNSTILE_SITE_KEY:}
enrosed.public-forms.turnstile.secret=${TURNSTILE_SECRET:}
enrosed.public-forms.turnstile.hostnames=${TURNSTILE_HOSTNAMES:}
enrosed.public-forms.turnstile.required=${TURNSTILE_REQUIRED:false}
%prod.enrosed.public-forms.turnstile.required=true
enrosed.public-forms.cleanup.every=${PUBLIC_FORM_CLEANUP_EVERY:1h}
enrosed.public-forms.require-preseeded-locks=false
%prod.enrosed.public-forms.require-preseeded-locks=true
enrosed.contact.outbox.every=${CONTACT_OUTBOX_EVERY:30s}
enrosed.contact.retention.days=${CONTACT_RETENTION_DAYS:730}
enrosed.contact.retention.every=${CONTACT_RETENTION_EVERY:24h}

# Website visit statistics. The website's edge function posts one beacon per page
# view; when this key is set, beacons without it are refused (set the same value
# as ENROSED_ANALYTICS_KEY on the Vercel project). Rows expire after the retention.
enrosed.analytics.ingest-key=${ENROSED_ANALYTICS_KEY:}
enrosed.analytics.retention.days=${WEBSITE_VISIT_RETENTION_DAYS:400}
# Belgian towns whose visits are our own (team, warehouse, family) and never count.
enrosed.analytics.excluded-cities=${WEBSITE_VISIT_EXCLUDED_CITIES:Tessenderlo,Mol,Balen,Geel,Arendonk,Dessel,Retie}
enrosed.analytics.retention.every=${WEBSITE_VISIT_RETENTION_EVERY:24h}

# ---------------------------------------------------------------- security
# Everything behind a login, except what is explicitly opened below.
# deny-unannotated-endpoints means: a new endpoint without an annotation is
# closed, not open. Forgetting is then inconvenient instead of dangerous.
quarkus.http.auth.basic=true
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# Fixed staff identities, written as username|Display name. Both currently use
# the same password at the owner's request, but authenticate as distinct server
# principals. Production may override the account list without storing secrets here.
enrosed.admin.accounts=${ENROSED_ADMIN_ACCOUNTS:emre|Emre,berat|Berat}
# bcrypt hash; the password itself lives nowhere in code or configuration.
# To make a new hash: BcryptUtil.bcryptHash("...")
enrosed.admin.password-hash=${ENROSED_ADMIN_PASSWORD_HASH:$2a$10$w2nUZGHa7mgFgIZCcJZLB.G6Dk7ZdxJdhowuJhmd3ExrqTaZWp2Ty}
# The browser exchanges the real password for a signed, expiring key. A
# dedicated production secret is recommended; falling back to the bcrypt hash
# makes a password change invalidate all existing sessions.
enrosed.admin.session-secret=${ENROSED_ADMIN_SESSION_SECRET:use-password-hash}
enrosed.admin.session-ttl-days=${ENROSED_ADMIN_SESSION_TTL_DAYS:90}

# ---------------------------------------------------------------- database
# H2 as a file on disk so local work needs no Docker. Data survives
# restarts: 'update' adapts the schema, 'drop-and-create' would wipe
# everything. For a clean start, delete the ./data directory.
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./data/enrosed;AUTO_SERVER=TRUE
quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=false

%prod.quarkus.datasource.db-kind=postgresql
# Railway's Postgres plugin exposes PGHOST/PGPORT/PGDATABASE/PGUSER/PGPASSWORD;
# these pick them up directly, so attaching the database is all it takes.
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:enrosed}
%prod.quarkus.datasource.username=${PGUSER:${DB_USERNAME:enrosed}}
%prod.quarkus.datasource.password=${PGPASSWORD:${DB_PASSWORD:enrosed}}
# "update" lets the first deploy create the schema. Once the model settles,
# switch DB_SCHEMA_STRATEGY to "validate" and manage changes deliberately.
%prod.quarkus.hibernate-orm.schema-management.strategy=${DB_SCHEMA_STRATEGY:update}

# ---------------------------------------------------------------- photos
# Original quality, validated as JPEG/PNG/GIF/WebP and limited to 25 MB,
# stored in the database. The larger HTTP limit leaves room for multipart framing.
quarkus.http.limits.max-body-size=64M

# Demo business data is always opt-in. A clean database after the canonical
# migration must stay clean on restart; production explicitly remains false.
enrosed.demo-data.enabled=${ENROSED_DEMO_DATA_ENABLED:false}
%prod.enrosed.demo-data.enabled=false

# ---------------------------------------------------------------- mail
#
# BY DEFAULT THIS APP SENDS NO MAIL.
#
# In development the mailer runs in mock mode: the quote is built and the
# mail lands in the log, but nothing leaves.
#
# In production mail goes through the Brevo HTTPS API (BREVO_API_KEY on the
# server) - Railway blocks outbound SMTP below the Pro plan, HTTPS it does
# not. The SMTP_ variables further down are the fallback route for hosting
# where SMTP is open.
quarkus.mailer.from=offertes@enrosed.be
quarkus.mailer.mock=true
#quarkus.mailer.host=smtp.gmail.com
#quarkus.mailer.port=587
#quarkus.mailer.start-tls=REQUIRED
#quarkus.mailer.username=offertes@enrosed.be
#quarkus.mailer.password=app-password-here

# Where internal notifications go (quote signed, change requested).
enrosed.mail.internal-recipient=verkoop@enrosed.be

# In production the SMTP settings come from environment variables (set on
# the Railway service). While SMTP_HOST is empty the mailer refuses with a
# clear message instead of a connection error.
%prod.quarkus.mailer.mock=false
%prod.quarkus.mailer.host=${SMTP_HOST:}
%prod.quarkus.mailer.port=${SMTP_PORT:587}
%prod.quarkus.mailer.start-tls=REQUIRED
%prod.quarkus.mailer.username=${SMTP_USERNAME:}
%prod.quarkus.mailer.password=${SMTP_PASSWORD:}
%prod.quarkus.mailer.from=${SMTP_FROM:offertes@enrosed.be}

# Base URL of the Angular app, for the customer link in the quote mail.
enrosed.portal.base-url=http://localhost:4321
# The links in quote PDFs and mails must point at the public Vercel app.
%prod.enrosed.portal.base-url=${PORTAL_BASE_URL:http://localhost:4321}
# The public website, for the links in customer mails (new request, contact).
enrosed.website.base-url=${WEBSITE_BASE_URL:https://enrosed.com}
# Every customer mail (quotation, invoice, cancellation) goes out with this address in blind copy.
enrosed.mail.customer-bcc=${ENROSED_MAIL_BCC:${ENROSED_MAIL_CC:admin@enrosed.com}}
# Every quotation that leaves is announced here with a readable summary and the PDF.
enrosed.mail.sales-copy=${ENROSED_MAIL_SALES:hello@enrosed.com}

# ---------------------------------------------------------------- openapi
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Enrosed API
quarkus.smallrye-openapi.info-version=1.0.0

# ------------------------------------------------------ public website rebuild
# Optional Vercel Deploy Hook. Mutations only enqueue a durable, debounced outbox row;
# the HTTP request happens later, outside the business transaction. Never log these URLs.
# Optional public JSON containing revision/siteCopyRevision/currentRevision. Hook acceptance
# remains TRIGGERED until this endpoint proves the deployed revision is LIVE.
# Keep the Quarkus scheduler enabled so the durable rebuild outbox can drain. Potentially
# outward-facing jobs can be disabled independently per environment.

# Morning phone notification. `off` is a Quarkus-supported disabled cron value. TEST must set
# DAILY_AGENDA_PUSH_CRON=off; the existing production default remains 09:00 Europe/Brussels.
enrosed.push.daily-agenda.cron=${DAILY_AGENDA_PUSH_CRON:0 0 9 * * ?}

# Mail through the Brevo HTTPS API. Railway blocks outbound SMTP below the
# Pro plan; an HTTPS mail service is the only route there. Empty = try SMTP.
enrosed.mail.brevo-api-key=${BREVO_API_KEY:}

# ------------------------------------------------------ freight market data
# The dashboard keeps and analyses weekly provider observations. ENROSED has
# confirmed provider permission for this internal installation, so connectors
# are available to the dashboard fallback by default. The scheduled job can be disabled per environment.
# Every source can still be stopped immediately with its environment flag set to false.
#
# Each authorized connector checks at most once per UTC day, stores at most
# one value per provider publication date, and serves the last valid cache on
# failure. Exact forwarder quotes entered by users never depend on these flags.
# The dashboard endpoint remains the throttled fallback. TEST must set
# MARKET_DATA_REFRESH_CRON=off; the existing production default remains 03:15 UTC.
enrosed.market.refresh.cron=${MARKET_DATA_REFRESH_CRON:0 15 3 * * ?}
enrosed.catalog.photo-rendition.cron=${PHOTO_RENDITION_BACKFILL_CRON:0/15 * * * * ?}
enrosed.media.legacy-index.every=${MEDIA_LEGACY_INDEX_EVERY:1m}
#
# Drewry: WCI Shanghai -> Rotterdam, USD/40ft. Drewry offers site licences and
# API access; confirm that the acquired agreement covers this application.
enrosed.market.drewry.automated-access-authorized=${DREWRY_AUTOMATED_ACCESS_AUTHORIZED:true}
# Baltic/Ningbo: exact NCFI Ningbo -> Europe route points (Hamburg/Rotterdam).
# Baltic classifies automated/non-display use as licensed market-data use.
enrosed.market.ncfi.automated-access-authorized=${NCFI_AUTOMATED_ACCESS_AUTHORIZED:true}
# SSE: CCFI China -> Europe route points. It is a broad coast-wide reference
# for Guangzhou/Nansha and Shenzhen/Yantian, never a port-specific quote.
enrosed.market.ccfi.automated-access-authorized=${CCFI_AUTOMATED_ACCESS_AUTHORIZED:true}
# Freightos: FBX11 China/East Asia -> North Europe, USD/40ft, read from the
# public index page. Internal dashboard use only.
enrosed.market.fbx.automated-access-authorized=${FBX_AUTOMATED_ACCESS_AUTHORIZED:true}
# NCFI composite (index points) from the weekly Hellenic Shipping News reprint -
# the one free, dated publication; backfills a year of Fridays when the log is thin.
enrosed.market.ncfi-composite.automated-access-authorized=${NCFI_COMPOSITE_AUTOMATED_ACCESS_AUTHORIZED:true}
